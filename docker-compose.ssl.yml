services:
  nginx:
    image: nginx:latest
    container_name: ariana-voice-ssl
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-328}:328"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - ariana-network

